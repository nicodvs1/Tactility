name: Build

inputs:
  board_id:
    description: The sdkconfig file to build
    required: true
  arch:
    description: The ESP32 SOC variant
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: 'Board select'
      shell: bash
      run: python device.py ${{ inputs.board_id }}
    # Compiler cache: only the sources that changed since the previous build of this board are recompiled
    - name: 'Restore compiler cache'
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ inputs.board_id }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.board_id }}-
    - name: 'Build'
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.1
        target: ${{ inputs.arch }}
        path: './'
        extra_docker_args: -e CCACHE_DIR=/app/${{ github.repository }}/.ccache -e CCACHE_BASEDIR=/app/${{ github.repository }} -e CCACHE_MAXSIZE=2G -e CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros
        # ESP-IDF v6.1 lacks the upstream fix that resets the crypto GDMA TX channel (espressif/esp-idf a07d84f).
        # Without it, SHA digests break after audio used that channel, and every TLS certificate check fails.
        command: (git -C "$IDF_PATH" apply --reverse --check "$PWD/Buildscripts/idf-patches/0001-crypto-gdma-tx-reset.patch" 2>/dev/null || git -C "$IDF_PATH" apply "$PWD/Buildscripts/idf-patches/0001-crypto-gdma-tx-reset.patch") && grep -q gdma_ll_tx_reset_channel "$IDF_PATH/components/mbedtls/port/crypto_shared_gdma/esp_crypto_shared_gdma.c" && idf.py --ccache build && (ccache --show-stats || true)
    - name: 'Save compiler cache'
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ inputs.board_id }}-${{ github.sha }}
    - name: 'Release'
      shell: bash
      run: Buildscripts/release.sh ${{ inputs.board_id }}
    - name: 'Merge binary'
      shell: bash
      run: |
        python -m pip install esptool
        cd release/Tactility-${{ inputs.board_id }}
        bash ./merge.sh ${{ inputs.arch }}
        mv Binaries/merged_binary.bin ../Tactility-${{ inputs.board_id }}.bin
    - name: 'Upload Artifact: Release'
      uses: actions/upload-artifact@v4
      with:
        name: Tactility-${{ inputs.board_id }}
        path: release/Tactility-${{ inputs.board_id }}
        retention-days: 30
    - name: 'Upload Artifact: Release symbols'
      uses: actions/upload-artifact@v4
      with:
        name: Tactility-${{ inputs.board_id }}-symbols
        path: release/Tactility-${{ inputs.board_id }}-symbols
        retention-days: 30
    - name: 'Upload Artifact: Merged binary'
      uses: actions/upload-artifact@v4
      with:
        name: Tactility-${{ inputs.board_id }}.bin
        path: release/Tactility-${{ inputs.board_id }}.bin
        retention-days: 30
