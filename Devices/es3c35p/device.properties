general.vendor=CYD
general.name=ES3C35P

hardware.target=ESP32S3
hardware.flashSize=16MB
hardware.spiRam=true
hardware.spiRamMode=OCT
hardware.spiRamSpeed=120M
hardware.esptoolFlashFreq=120M
hardware.tinyUsbMsc=true
hardware.bluetooth=true

display.size=3.5"
display.dpi=165

lvgl.colorDepth=16

storage.userDataLocation=SD

# Lets the certificate bundle anchor chains that end in a cross-signed root, like Google's
sdkconfig.CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY=y
# TLS ciphers and hashes in software: their DMA failed next to the display and audio DMA
sdkconfig.CONFIG_MBEDTLS_HARDWARE_AES=n
sdkconfig.CONFIG_MBEDTLS_HARDWARE_SHA=n
